<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SpecQuiz — Certifications</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
        h1 { font-size: 1.5rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #f5f5f5; }
        a.button, .button { display: inline-block; padding: 0.4rem 0.8rem; background: #2b6cb0; color: #fff;
            text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .muted { color: #666; }
    </style>
</head>
<body>
<h1>Certifications</h1>
<p><a class="button" th:href="@{/certifications/new}">+ New certification</a></p>

<table>
    <thead>
    <tr><th>Title</th><th>Pass %</th><th>Questions asked</th><th>Sections</th><th>Total questions</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="c : ${certificates}">
        <td th:text="${c.title}">Title</td>
        <td th:text="${c.passPercentage}">70</td>
        <td th:text="${c.questionsToAsk}">5</td>
        <td th:text="${#lists.size(c.sections)}">1</td>
        <td th:text="${c.totalQuestions()}">5</td>
        <td><a th:href="@{'/certifications/' + ${c.id}}">Open</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(certificates)}">
        <td colspan="6" class="muted">No certifications yet.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
