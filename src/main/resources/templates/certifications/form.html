<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SpecQuiz — New Certification</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
        label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
        input { padding: 0.4rem; width: 22rem; max-width: 100%; }
        .error { color: #c53030; font-size: 0.85rem; }
        .button { margin-top: 1rem; padding: 0.5rem 1rem; background: #2b6cb0; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<h1>New certification</h1>
<form th:action="@{/certifications}" th:object="${certificationRequest}" method="post">
    <label for="title">Certificate title</label>
    <input id="title" type="text" th:field="*{title}" placeholder="e.g. AWS Certified AI Practitioner"/>
    <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">title error</div>

    <label for="passPercentage">Pass percentage (1-100)</label>
    <input id="passPercentage" type="number" min="1" max="100" th:field="*{passPercentage}"/>
    <div class="error" th:if="${#fields.hasErrors('passPercentage')}" th:errors="*{passPercentage}">pass error</div>

    <label for="questionsToAsk">Questions to ask (min 5)</label>
    <input id="questionsToAsk" type="number" min="5" th:field="*{questionsToAsk}"/>
    <div class="error" th:if="${#fields.hasErrors('questionsToAsk')}" th:errors="*{questionsToAsk}">ask error</div>

    <div><button class="button" type="submit">Create</button></div>
</form>
<p><a th:href="@{/certifications}">Back to list</a></p>
</body>
</html>
