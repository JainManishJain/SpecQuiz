# JSON Schema (draft-07), expressed in YAML.
$id: "specflow:phase:1-requirements:prd"
title: SpecFlow PRD Artifact (optional tier)
description: Contract for the optional Product Requirements Document tier.
type: object
additionalProperties: false
required: [meta, summary, personas, features]
properties:
  meta:
    type: object
    additionalProperties: false
    required: [featureId, slug, title, phase, tier, status, sourceArtifact]
    properties:
      featureId: { type: string, pattern: "^FEAT-[0-9]{3}$" }
      slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      title: { type: string, minLength: 3 }
      phase: { const: requirements }
      tier: { const: prd }
      status: { enum: [draft, approved] }
      sourceArtifact:
        description: Should reference the BRD when it exists.
        type: ["string", "null"]
  summary:
    type: string
    minLength: 20
  personas:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, description, needs]
      properties:
        name: { type: string }
        description: { type: string }
        needs:
          type: array
          minItems: 1
          items: { type: string }
  features:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, description, priority]
      properties:
        id: { type: string, pattern: "^PRD-[0-9]{3}$" }
        name: { type: string }
        description: { type: string }
        priority: { enum: [must, should, could, wont] }
        tracesToBrd:
          type: array
          items: { type: string, pattern: "^BRD-[0-9]{3}$" }
        uxNotes: { type: string }
  userJourneys:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          minItems: 1
          items: { type: string }
  releaseScope:
    type: object
    additionalProperties: false
    properties:
      inScope:
        type: array
        items: { type: string }
      outOfScope:
        type: array
        items: { type: string }
